<div class="manage-container animate-fade-in">
  <div class="header-section flex-header">
    <div>
      <h3>تصنيفات الخدمات</h3>
      <p>إدارة تصنيفات الخدمات والمشاريع الموجودة في الموقع</p>
    </div>
    <button (click)="openAddForm()" class="btn-primary-sm">
      <i class="bi bi-plus-lg"></i> إضافة تصنيف جديد
    </button>
  </div>

  <!-- Banners -->
  <div *ngIf="successMessage" class="alert-success animate-fade-in">
    <i class="bi bi-check-circle-fill"></i> {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="alert-error animate-fade-in">
    <i class="bi bi-exclamation-triangle-fill"></i> {{ errorMessage }}
  </div>

  <div *ngIf="isLoading" class="loading-state">
    <div class="spinner"></div>
    <span>جاري تحميل التصنيفات...</span>
  </div>

  <!-- Table list -->
  <div *ngIf="!isLoading" class="table-card">
    <table class="admin-table">
      <thead>
        <tr>
          <th style="width: 80px;">الرقم</th>
          <th>اسم التصنيف</th>
          <th>الوصف</th>
          <th style="width: 150px; text-align: center;">العمليات</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let cat of categories; let i = index">
          <td>{{ cat.id }}</td>
          <td class="font-bold text-white">{{ cat.name }}</td>
          <td class="text-desc text-truncate">{{ cat.description || 'لا يوجد وصف' }}</td>
          <td>
            <div class="action-buttons">
              <button (click)="openEditForm(cat)" class="btn-action edit" title="تعديل">
                <i class="bi bi-pencil-square"></i>
              </button>
              <button (click)="deleteCategory(cat.id)" class="btn-action delete" title="حذف">
                <i class="bi bi-trash-fill"></i>
              </button>
            </div>
          </td>
        </tr>
        <tr *ngIf="categories.length === 0">
          <td colspan="4" class="empty-row">لا توجد تصنيفات حالياً. قم بإضافة تصنيف جديد.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal Form Backdrop -->
  <div *ngIf="isFormOpen" class="modal-backdrop animate-fade-in">
    <div class="modal-card">
      <div class="modal-header">
        <h4>{{ formTitle }}</h4>
        <button (click)="closeForm()" class="btn-close"><i class="bi bi-x-lg"></i></button>
      </div>

      <form (ngSubmit)="onSubmit()">
        <div class="modal-body">
          <div class="form-group">
            <label for="catName">اسم التصنيف *</label>
            <input type="text" id="catName" [(ngModel)]="name" name="name" required placeholder="مثال: تسويق رقمي" />
          </div>

          <div class="form-group">
            <label for="catDesc">الوصف</label>
            <textarea id="catDesc" [(ngModel)]="description" name="description" rows="4" placeholder="اكتب وصفاً مختصراً للتصنيف..."></textarea>
          </div>
        </div>

        <div class="modal-footer">
          <button type="button" (click)="closeForm()" class="btn-secondary">إلغاء</button>
          <button type="submit" [disabled]="isSaving" class="btn-primary">
            <span *ngIf="!isSaving">حفظ</span>
            <span *ngIf="isSaving" class="btn-spinner"></span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
